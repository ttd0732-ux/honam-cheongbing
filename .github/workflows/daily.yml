name: daily-update
on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 청빙게시판 수집
        run: python3 scripts/scrape.py --lastdays 30
      - name: index.html 새로 만들기
        run: python3 scripts/build.py
      - name: 저장소에 반영
        run: |
          git config user.name "cheongbing-bot"
          git config user.email "cheongbing-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "daily update $(date -u +%F)"
          git push
